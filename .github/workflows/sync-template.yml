name: Sync Template

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-sync
  cancel-in-progress: true

env:
  TEMPLATE_REPOSITORY: https://github.com/NKU100/zygisk-module-webui-template.git
  TEMPLATE_REF: master
  TEMPLATE_SYNC_BRANCH: chore/template-sync

jobs:
  sync:
    name: Sync template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}

      - name: Merge template updates
        env:
          TEMPLATE_REMOTE: template
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chmod +x ./scripts/template-sync.sh
          ./scripts/template-sync.sh

      - name: Stash checkout-only changes
        run: git stash push --include-untracked --message template-sync-worktree-cleanup

      - name: Create or update pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: ${{ env.TEMPLATE_SYNC_BRANCH }}
          delete-branch: true
          title: 'chore: sync template updates'
          commit-message: 'chore: sync template updates'
          body: |
            This pull request contains the latest changes from the template repository.

            The workflow enables squash auto-merge when GitHub confirms this pull request is mergeable. Pull requests with conflicts or unresolved merge requirements remain open for review.

      - name: Enable auto-merge when the pull request is mergeable
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: |
          for attempt in {1..10}; do
            mergeable=$(gh pr view "$PR_NUMBER" --json mergeable --jq '.mergeable')
            if [[ "$mergeable" != "UNKNOWN" ]]; then
              break
            fi
            if (( attempt < 10 )); then
              sleep 3
            fi
          done

          if [[ "$mergeable" != "MERGEABLE" ]]; then
            echo "Template sync PR is not confirmed mergeable (state: $mergeable); leaving it open."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
